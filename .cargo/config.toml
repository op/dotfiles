[env]
# One mold instance at a time to cap peak memory, see mold(1).
MOLD_JOBS = "1"

# mold: faster than ld, which can hit ~3GB RSS per link.
# https://github.com/rust-lang/cargo/issues/12912
# Requires mold on PATH (home-manager); GCC 12+ handles -fuse-ld=mold.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Release build with debug info, for profiling.
[profile.profiling]
inherits = "release"
debug = true
